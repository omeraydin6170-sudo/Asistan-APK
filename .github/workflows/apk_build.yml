name: APK Derleyici (Poco C65)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Buildozer Kurulumu
        run: |
          pip install --upgrade pip
          pip install buildozer kivy cython

      - name: Sistem Paketleri
        run: sudo apt-get install -y libtool autoconf automake pkg-config zlib1g-dev libffi-dev libssl-dev build-essential

      - name: APK'yı Pişir (Debug)
        run: |
          yes | buildozer android debug
        
      - name: APK'yı Teslim Et
        uses: actions/upload-artifact@v4
        with:
          name: Poco-C65-Asistan-APK
          path: bin/*.apk
